<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Produk - AdminPanel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen">
    <aside class="w-64 bg-slate-800 text-white flex flex-col justify-between">
        <div>
            <div class="p-5 text-xl font-bold border-b border-slate-700">MyAdmin</div>
            <nav class="p-4 space-y-2">
                <a href="dashboard.html" class="block py-2.5 px-4 rounded transition hover:bg-slate-700">Dashboard</a>
                <a href="products.html" class="block py-2.5 px-4 rounded bg-slate-700 transition">Products</a>
                <a href="#" class="block py-2.5 px-4 rounded transition hover:bg-slate-700">Users</a>
                <a href="#" class="block py-2.5 px-4 rounded transition hover:bg-slate-700">Setting</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-700">
            <a href="index.html" class="block py-2.5 px-4 rounded text-red-400 hover:bg-slate-700 transition">Logout</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center">
            <span class="font-semibold text-gray-700">Product Panel</span>
            <span class="text-sm text-gray-500">Halo, Admin</span>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto p-6">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-gray-800">Manajemen Produk</h1>
                <a href="add-produk.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition text-sm font-semibold">+ Add Product</a>
            </div>

            <div class="bg-white rounded-lg shadow overflow-hidden border">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm border-b">
                            <th class="p-3">No</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Stock</th>
                            <th class="p-3">Action</th>
                        </tr>
                    </thead>
                    <tbody class="text-gray-700 text-sm">
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3">1</td>
                            <td class="p-3 font-medium">Sepatu Sneakers</td>
                            <td class="p-3">25</td>
                            <td class="p-3 space-x-2">
                                <a href="edit-produk.html" class="text-blue-600 hover:underline">Edit</a>
                                <a href="#" class="text-red-600 hover:underline">Delete</a>
                            </td>
                        </tr>
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-3">2</td>
                            <td class="p-3 font-medium">Kaos Polos Hitam</td>
                            <td class="p-3">50</td>
                            <td class="p-3 space-x-2">
                                <a href="edit-produk.html" class="text-blue-600 hover:underline">Edit</a>
                                <a href="#" class="text-red-600 hover:underline">Delete</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>

        <footer class="bg-white text-center p-4 text-sm text-gray-500 border-t">
            &copy; 2026 Admin Template. All rights reserved.
        </footer>
    </div>
</body>
</html>
