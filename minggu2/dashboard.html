<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AdminPanel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen">
    <aside class="w-64 bg-slate-800 text-white flex flex-col justify-between">
        <div>
            <div class="p-5 text-xl font-bold border-b border-slate-700">MyAdmin</div>
            <nav class="p-4 space-y-2">
                <a href="dashboard.html" class="block py-2.5 px-4 rounded bg-slate-700 transition">Dashboard</a>
                <a href="products.html" class="block py-2.5 px-4 rounded transition hover:bg-slate-700">Products</a>
                <a href="#" class="block py-2.5 px-4 rounded transition hover:bg-slate-700">Users</a>
                <a href="#" class="block py-2.5 px-4 rounded transition hover:bg-slate-700">Setting</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-700">
            <a href="index.html" class="block py-2.5 px-4 rounded text-red-400 hover:bg-slate-700 transition">Logout</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center">
            <span class="font-semibold text-gray-700">Dashboard Panel</span>
            <span class="text-sm text-gray-500">Halo, Admin</span>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Dashboard E-Commerce</h1>
            <!-- 4 Card Statistik E-Commerce -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div class="bg-white p-5 rounded-lg shadow border">
                    <p class="text-sm text-gray-500">Total Pendapatan</p>
                    <h3 class="text-xl font-bold text-gray-800 mt-1">Rp 45.200.000</h3>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border">
                    <p class="text-sm text-gray-500">Total Pesanan</p>
                    <h3 class="text-xl font-bold text-gray-800 mt-1">1,245</h3>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border">
                    <p class="text-sm text-gray-500">Produk Terjual</p>
                    <h3 class="text-xl font-bold text-gray-800 mt-1">3,890</h3>
                </div>
                <div class="bg-white p-5 rounded-lg shadow border">
                    <p class="text-sm text-gray-500">Pengguna Aktif</p>
                    <h3 class="text-xl font-bold text-gray-800 mt-1">528</h3>
                </div>
            </div>
        </main>

        <footer class="bg-white text-center p-4 text-sm text-gray-500 border-t">
            &copy; 2026 Admin Template. All rights reserved.
        </footer>
    </div>
</body>
</html>
