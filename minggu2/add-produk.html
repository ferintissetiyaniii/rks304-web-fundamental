<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Produk - AdminPanel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex h-screen">
    <aside class="w-64 bg-slate-800 text-white flex flex-col justify-between">
        <div>
            <div class="p-5 text-xl font-bold border-b border-slate-700">MyAdmin</div>
            <nav class="p-4 space-y-2">
                <a href="dashboard.html" class="block py-2.5 px-4 rounded transition hover:bg-slate-700">Dashboard</a>
                <a href="products.html" class="block py-2.5 px-4 rounded bg-slate-700 transition">Products</a>
                <a href="#" class="block py-2.5 px-4 rounded transition hover:bg-slate-700">Users</a>
                <a href="#" class="block py-2.5 px-4 rounded transition hover:bg-slate-700">Setting</a>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-700">
            <a href="index.html" class="block py-2.5 px-4 rounded text-red-400 hover:bg-slate-700 transition">Logout</a>
        </div>
    </aside>

    <div class="flex-1 flex flex-col overflow-hidden">
        <header class="bg-white shadow-sm p-4 flex justify-between items-center">
            <span class="font-semibold text-gray-700">Product Management</span>
            <span class="text-sm text-gray-500">Halo, Admin</span>
        </header>

        <main class="flex-1 overflow-x-hidden overflow-y-auto p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6">Add Produk</h1>
            
            <div class="bg-white p-6 rounded-lg shadow border max-w-xl">
                <form action="products.html" method="GET">
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Name</label>
                        <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" type="text" placeholder="Nama produk" required>
                    </div>
                    <div class="mb-4">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Stock</label>
                        <input class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" type="number" placeholder="Jumlah stok" required>
                    </div>
                    <div class="mb-6">
                        <label class="block text-gray-700 text-sm font-bold mb-2">Description</label>
                        <textarea class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" rows="3" placeholder="Deskripsi produk"></textarea>
                    </div>
                    <button type="submit" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition">Submit</button>
                </form>
            </div>
        </main>

        <footer class="bg-white text-center p-4 text-sm text-gray-500 border-t">
            &copy; 2026 Admin Template. All rights reserved.
        </footer>
    </div>
</body>
</html>
